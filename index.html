<!-- LARA v019 -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { background: #0d3a66; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 28px; }
    .btn { background: #185fa5; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #0d3a66; }
    .documents { background: white; border-radius: 8px; padding: 20px; }
    .doc-item { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .doc-info { flex: 1; }
    .doc-name { font-weight: bold; font-size: 16px; }
    .doc-meta { font-size: 12px; color: #666; margin-top: 5px; }
    .doc-actions { display: flex; gap: 8px; }
    .doc-actions button { padding: 8px 16px; border-radius: 4px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; }
    .btn-view { background: #185fa5; color: white; text-decoration: none; display: inline-block; padding: 8px 16px; }
    .btn-view:hover { background: #0d3a66; }
    .btn-delete { background: #b3352c; color: white; }
    .btn-delete:hover { background: #8a2620; }
    .empty { text-align: center; color: #999; padding: 40px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-box { background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 400px; }
    .modal-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
    .modal-box button { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-submit { background: #2e7d46; color: white; }
    .btn-cancel { background: #999; color: white; }
    .msg { position: fixed; top: 20px; right: 20px; padding: 15px 20px; border-radius: 6px; color: white; z-index: 2000; animation: slide 0.3s; }
    .msg.ok { background: #2e7d46; }
    .msg.err { background: #b3352c; }
    @keyframes slide { from { transform: translateX(400px); } to { transform: translateX(0); } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div><h1>📋 LARA v019</h1></div>
    <button class="btn" onclick="openModal()">+ Ajouter</button>
  </header>

  <div class="documents">
    <h2 style="margin-bottom: 15px;">Documents</h2>
    <div id="docsList">
      <div class="empty">Chargement...</div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>+ Ajouter un Document</h2>
    <input type="text" id="docName" placeholder="Nom du document" required>
    <input type="text" id="docDesc" placeholder="Description (optionnel)">
    <input type="file" id="file" required>
    <button class="btn-submit" onclick="upload()">Ajouter</button>
    <button class="btn-cancel" onclick="closeModal()">Annuler</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbw2BXatEY0nzswtXCAUvohGXmFXe2yeleAUej0ps2pyBQwaI-7WFE_VzaB6K0_ADpXl/exec";
let docs = [];

function openModal() { document.getElementById("modal").classList.add("active"); }
function closeModal() { document.getElementById("modal").classList.remove("active"); document.getElementById("file").value = ""; document.getElementById("docName").value = ""; document.getElementById("docDesc").value = ""; }
function msg(text, ok) {
  let m = document.createElement("div");
  m.className = "msg " + (ok ? "ok" : "err");
  m.textContent = text;
  document.body.appendChild(m);
  setTimeout(() => m.remove(), 3000);
}

async function load() {
  try {
    let r = await fetch(API);
    let j = await r.json();
    if (j && j.ok && j.data) {
      docs = j.data;
      render();
    }
  } catch (e) { console.error(e); }
}

async function upload() {
  let docName = document.getElementById("docName").value;
  let docDesc = document.getElementById("docDesc").value;
  let file = document.getElementById("file").files[0];
  if (!docName || !file) { msg("Remplis tous les champs requis", false); return; }
  
  let reader = new FileReader();
  reader.onload = async (e) => {
    let data = e.target.result.split(",")[1];
    try {
      let r = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ cat: "document", name: docName, filename: file.name, date: new Date().toISOString().split("T")[0], desc: docDesc || "", file: data })
      });
      let j = await r.json();
      if (j && j.success) {
        msg("✅ Document ajouté!", true);
        closeModal();
        setTimeout(load, 500);
      } else {
        msg("❌ Erreur: " + (j?.message || "unknown"), false);
      }
    } catch (e) {
      msg("❌ Erreur: " + e.message, false);
    }
  };
  reader.readAsDataURL(file);
}

async function deleteDoc(id, name) {
  if (!confirm(`Supprimer "${name}" ?`)) return;
  docs = docs.filter(d => d.id !== id);
  render();
  msg("✅ Document supprimé!", true);
  setTimeout(load, 500);
}

function render() {
  let html = "";
  if (docs.length === 0) {
    html = '<div class="empty">Aucun document</div>';
  } else {
    docs.forEach(d => {
      let meta = [];
      if (d.filename) meta.push(`📁 ${d.filename}`);
      if (d.date) meta.push(`📅 ${d.date}`);
      if (d.desc) meta.push(`📝 ${d.desc}`);
      
      html += `<div class="doc-item">
        <div class="doc-info">
          <div class="doc-name">${d.name}</div>
          <div class="doc-meta">${meta.join(" | ")}</div>
        </div>
        <div class="doc-actions">
          <a href="${d.url}" target="_blank" class="btn-view">👁️ Voir</a>
          <button class="btn-delete" onclick="deleteDoc('${d.id}', '${d.name.replace(/'/g, "\\'")}')">🗑️ Supprimer</button>
        </div>
      </div>`;
    });
  }
  document.getElementById("docsList").innerHTML = html;
}

load();
setInterval(load, 5000);
</script>

</body>
</html>
