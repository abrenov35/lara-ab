<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARA - Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { background: #0d3a66; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    header h1 { font-size: 28px; }
    .btn { background: #185fa5; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #0d3a66; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-box { background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 400px; }
    .modal-box button { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-submit { background: #2e7d46; color: white; }
    .btn-cancel { background: #999; color: white; }
    .msg { position: fixed; top: 20px; right: 20px; padding: 15px 20px; border-radius: 6px; color: white; z-index: 2000; animation: slide 0.3s; }
    .msg.ok { background: #2e7d46; }
    .msg.err { background: #b3352c; }
    @keyframes slide { from { transform: translateX(400px); } to { transform: translateX(0); } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📋 LARA - TEST</h1>
  </header>
  <button class="btn" onclick="openModal()">+ Test Upload</button>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>Upload File</h2>
    <input type="file" id="file" required>
    <button class="btn-submit" onclick="upload()">Ajouter</button>
    <button class="btn-cancel" onclick="closeModal()">Annuler</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycby9UXuqp_mLYMtdA5Kc8Xu93PLhPa0DoWuXYzqlavoDTBTAPNGpt65EDnfLftSYiS97/exec";

function openModal() { document.getElementById("modal").classList.add("active"); }
function closeModal() { document.getElementById("modal").classList.remove("active"); }
function msg(text, ok) {
  console.log("MSG:", text, ok);
  let m = document.createElement("div");
  m.className = "msg " + (ok ? "ok" : "err");
  m.textContent = text;
  document.body.appendChild(m);
  setTimeout(() => m.remove(), 3000);
}

async function upload() {
  let file = document.getElementById("file").files[0];
  console.log("Upload file:", file?.name);
  if (!file) { msg("Sélectionne un fichier", false); return; }
  
  let reader = new FileReader();
  reader.onload = async (e) => {
    let data = e.target.result.split(",")[1];
    try {
      let payload = { action: "upload", cat: "photo", name: file.name, date: "2026-07-26", desc: "test", file: data };
      console.log("Sending...");
      let r = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      console.log("Status:", r.status);
      let text = await r.text();
      console.log("Response:", text);
      let j = JSON.parse(text);
      if (j && j.ok) {
        msg("✅ OK!", true);
        closeModal();
      } else {
        msg("❌ " + (j?.msg || "Erreur"), false);
      }
    } catch (e) {
      console.error("Error:", e);
      msg("❌ " + e.message, false);
    }
  };
  reader.readAsDataURL(file);
}

console.log("LARA Test loaded");
</script>

</body>
</html>
